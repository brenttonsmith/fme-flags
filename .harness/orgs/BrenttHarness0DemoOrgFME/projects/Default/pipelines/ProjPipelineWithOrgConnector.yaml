pipeline:
  name: ProjPipelineWithOrgConnector
  identifier: ProjPipelineWithOrgConnector
  projectIdentifier: Default
  orgIdentifier: BrenttHarness0DemoOrgFME
  tags: {}
  stages:
    - stage:
        name: step1
        identifier: step1
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: echo "hello"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
              - step:
                  type: CustomApproval
                  name: CustomApproval_1
                  identifier: CustomApproval_1
                  spec:
                    rejectionCriteria:
                      type: KeyValues
                      spec:
                        matchAnyCondition: true
                        conditions: []
                    approvalCriteria:
                      type: KeyValues
                      spec:
                        matchAnyCondition: true
                        conditions:
                          - key: f
                            operator: equals
                            value: "1"
                    scriptTimeout: 10m
                    retryInterval: 1m
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          #
                          # Specify output variables in the step and these
                          # variables should be used for setting up the approval 
                          # and rejection criteria.
                          #
                          echo "12"
                    environmentVariables: []
                    outputVariables:
                      - name: "n"
                        type: String
                        value: a
                  timeout: 1d
        tags: {}
