pipeline:
  name: SecondPipeline
  identifier: SecondPipeline
  projectIdentifier: Default
  orgIdentifier: BrenttHarness0DemoOrgFME
  tags: {}
  stages:
    - stage:
        name: stage1
        identifier: stage1
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: CustomApproval
                  name: CustomApproval_1
                  identifier: CustomApproval_1
                  spec:
                    rejectionCriteria:
                      type: KeyValues
                      spec:
                        matchAnyCondition: true
                        conditions: []
                    approvalCriteria:
                      type: KeyValues
                      spec:
                        matchAnyCondition: true
                        conditions:
                          - key: approved
                            operator: equals
                            value: "true"
                    scriptTimeout: 10m
                    retryInterval: 1m
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |-
                          #
                          # Specify output variables in the step and these
                          # variables should be used for setting up the approval 
                          # and rejection criteria.
                          #
                          echo "work"
                          exit 0
                    environmentVariables: []
                    outputVariables:
                      - name: approved
                        type: String
                        value: "true"
                  timeout: 1d
        tags: {}
